<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสุริยะของเรา</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ---------------- CSS: ตกแต่งธีมอวกาศ ---------------- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #0b0b2a 0%, #1a1a4b 50%, #3a0ca3 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            z-index: -1;
            animation: moveStars 150s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0, 40px 60px, 130px 270px; }
            to { background-position: -550px -550px, -310px -490px, -120px -280px; }
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 40px rgba(114, 9, 183, 0.6);
            text-align: center;
        }

        h1 {
            color: #4cc9f0;
            text-shadow: 0 0 15px #4cc9f0;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        p.description {
            color: #e0e0e0;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            display: block;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 18px 24px;
            border-radius: 50px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-pretest {
            background: linear-gradient(90deg, #4361ee 0%, #3f37c9 100%);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
            border: 2px solid #4895ef;
        }

        .btn-posttest {
            background: linear-gradient(90deg, #7209b7 0%, #b5179e 100%);
            box-shadow: 0 5px 15px rgba(114, 9, 183, 0.4);
            border: 2px solid #f72585;
        }

        .btn:hover {
            transform: translateY(-5px);
        }

        /* สไตล์สำหรับปุ่มที่ถูกคลิกไปแล้ว (สีจะเปลี่ยนนิดหน่อยให้ดูว่าทำแล้ว) */
        .btn.completed {
            background: linear-gradient(90deg, #2b9348 0%, #007f5f 100%);
            box-shadow: 0 5px 15px rgba(43, 147, 72, 0.4);
            border: 2px solid #52b788;
        }

        .icon {
            margin-right: 10px;
            font-size: 1.4rem;
        }

        .status-text {
            font-size: 1rem;
            color: #a7c957;
            margin-left: 10px;
            font-weight: normal;
        }

        .reset-btn {
            margin-top: 30px;
            background: none;
            border: none;
            color: #888;
            text-decoration: underline;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
        }
        .reset-btn:hover {
            color: #fff;
        }

    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <h1>🚀 ระบบสุริยะของเรา</h1>
        <p class="description">ยินดีต้อนรับน้องๆ เข้าสู่แบบทดสอบก่อนเรียนและแบบทดสอบหลังเรียน!<br>โปรดเลือกแบบทดสอบที่คุณต้องการดำเนินการด้านล่างนี้</p>
        
        <div class="btn-group">
            <!-- เพิ่ม id="btn-pretest" และ onclick event -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfcXVNiKboxJCIsR5IQQOGzsfY5_t1efxJiq1FqnLPAj9nDUQ/viewform?usp=dialog" 
               target="_blank" 
               class="btn btn-pretest" 
               id="btn-pretest"
               onclick="markAsCompleted('pretest')">
                <span class="icon">📝</span> แบบทดสอบก่อนเรียน 
                <span id="status-pretest" class="status-text"></span>
            </a>

            <!-- เพิ่ม id="btn-posttest" และ onclick event -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeKBewpdjRx_cB8IDioMkJmN51iG7AL_yBEeJL7oLO4EPDz0A/viewform?usp=publish-editor" 
               target="_blank" 
               class="btn btn-posttest"
               id="btn-posttest"
               onclick="markAsCompleted('posttest')">
                <span class="icon">🏆</span> แบบทดสอบหลังเรียน 
                <span id="status-posttest" class="status-text"></span>
            </a>
        </div>

        <!-- ปุ่มล้างข้อมูลความจำ (เผื่อให้นักเรียนคนอื่นมาทำเครื่องต่อ) -->
        <button class="reset-btn" onclick="resetProgress()">ล้างประวัติการทำภารกิจ</button>
    </div>

    <!-- ---------------- JavaScript: ระบบจดจำการคลิก ---------------- -->
    <script>
        // เมื่อโหลดหน้าเว็บ ให้เช็คว่าเคยคลิกปุ่มไปหรือยัง
        window.onload = function() {
            checkStatus();
        };

        // ฟังก์ชันจดจำเมื่อปุ่มถูกคลิก
        function markAsCompleted(testType) {
            // บันทึกข้อมูลลงในเบราว์เซอร์
            localStorage.setItem(testType + '_completed', 'true');
            
            // อัปเดตหน้าจอทันที
            updateUI(testType);
        }

        // ฟังก์ชันตรวจสอบสถานะจากเบราว์เซอร์
        function checkStatus() {
            if(localStorage.getItem('pretest_completed') === 'true') {
                updateUI('pretest');
            }
            if(localStorage.getItem('posttest_completed') === 'true') {
                updateUI('posttest');
            }
        }

        // ฟังก์ชันเปลี่ยนสีปุ่มและแสดงคำว่า ✅ (เสร็จสิ้น)
        function updateUI(testType) {
            const btn = document.getElementById('btn-' + testType);
            const statusSpan = document.getElementById('status-' + testType);
            
            if(btn && statusSpan) {
                btn.classList.add('completed'); // เปลี่ยนปุ่มเป็นสีเขียว
                statusSpan.innerHTML = "✅ (เสร็จสิ้น)";
            }
        }

        // ฟังก์ชันล้างข้อมูล (เผื่อมีนักเรียนใช้คอมพิวเตอร์เครื่องเดียวกัน)
        function resetProgress() {
            if(confirm("คุณต้องการล้างประวัติการทำแบบทดสอบบนเครื่องนี้ใช่หรือไม่?")) {
                localStorage.removeItem('pretest_completed');
                localStorage.removeItem('posttest_completed');
                location.reload(); // รีเฟรชหน้าเว็บ
            }
        }
    </script>

</body>
</html>
